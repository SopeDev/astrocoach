services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: astrocoach
      POSTGRES_USER: astrocoach
      POSTGRES_PASSWORD: astrocoach
    ports:
      - "5432:5432"
    volumes:
      - astrocoach_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrocoach -d astrocoach"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  astrocoach_postgres_data:
